<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Prototipos por Versión - Violeta</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#140f22">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0; padding: 76px 12px 260px 12px;
    background: #1a1528; color: #e8e0f5; font-size: 14px;
    overflow-y: auto;
  }
  body.preview-fullscreen { overflow: hidden; }

  /* ===== BARRA SUPERIOR FIJA ===== */
  #topBar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #140f22;
    border-bottom: 1px solid #2e2444;
    box-shadow: 0 2px 12px rgba(0,0,0,0.6);
    min-height: 60px;
  }
  .top-bar-icon { font-size: 18px; flex-shrink: 0; }
  .top-bar-select {
    flex: 1;
    background: transparent;
    color: #c084fc;
    font-size: 14px;
    font-weight: 700;
    border: none;
    padding: 6px 4px;
    appearance: none;
    -webkit-appearance: none;
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
    min-width: 0;
    cursor: pointer;
    font-family: ui-monospace, monospace;
  }
  .top-bar-select:focus { outline: none; }
  .top-bar-status {
    display: flex; align-items: center;
    font-size: 11px; color: #9b8fb8;
    white-space: nowrap; flex-shrink: 0;
  }

  select, input[type="text"] {
    background: #2a2040; color: #e8e0f5; border: 1px solid #3a2e52;
    border-radius: 8px; padding: 10px; font-size: 14px; width: 100%;
  }

  textarea {
    width: 100%; height: 240px; padding: 10px; border-radius: 8px;
    background: #251c3d; color: #e8e0f5; border: 1px solid #3a2e52;
    font-family: ui-monospace, monospace; font-size: 13px; resize: vertical;
    line-height: 1.4;
  }
  textarea[readonly] {
    background: #18122a; color: #b3a7cc; border-color: #2e2444;
    cursor: default;
  }
  h3 {
    margin: 12px 0 4px; font-size: 12px; color: #9b8fb8;
    text-transform: uppercase; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 8px;
  }

  .info {
    font-size: 12px; color: #9b8fb8; padding: 4px 2px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #666;
    display: inline-block; margin-right: 4px;
  }
  .status-dot.saved { background: #4ade80; }
  .status-dot.saving { background: #facc15; }
  .status-dot.error { background: #f87171; }

  /* =========================================================
     TARJETA DE VISTA PREVIA
     ========================================================= */
  .preview-container {
    position: relative;
    display: flex;
    flex-direction: column;
    background: #140f22;
    border: 1px solid #2e2444;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    transition: border-radius 0.2s ease;
  }

  /* Barra superior del preview (solo en fullscreen) */
  .preview-topbar {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: #140f22;
    border-bottom: 1px solid #2e2444;
    flex-shrink: 0;
  }
  .preview-topbar .nav-btn {
    background: #2e2444; color: #c084fc;
    border: 1px solid #4a3a68;
    width: 40px; height: 40px;
    border-radius: 10px;
    font-size: 16px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    padding: 0;
  }
  .preview-topbar .nav-btn:active { background: #4a3a68; transform: scale(0.94); }
  .preview-topbar .nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .preview-topbar .preview-title {
    flex: 1;
    font-size: 13px;
    font-weight: 700;
    color: #c084fc;
    font-family: ui-monospace, monospace;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    padding: 0 6px;
  }
  .preview-topbar .close-btn {
    background: #4a1738; color: #ffb4dc;
    border: 1px solid #6b1f52;
    width: 40px; height: 40px;
    border-radius: 10px;
    font-size: 16px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    padding: 0;
  }
  .preview-topbar .close-btn:active { background: #6b1f52; }

  /* Cuerpo del preview */
  .preview-body {
    position: relative;
    flex: 1;
    min-height: 280px;
    background: #fff;
  }
  #preview {
    width: 100%; height: 100%;
    border: none;
    background: #fff;
    display: block;
  }

  /* Botón "Ver en grande" (solo en modo tarjeta) */
  .open-full-btn {
    position: absolute;
    bottom: 10px; right: 10px;
    background: rgba(20,15,34,0.9);
    color: #fff;
    border: 1px solid #a855f7;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 12px; font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(168,85,247,0.5);
    z-index: 5;
    display: flex; align-items: center; gap: 5px;
  }
  .open-full-btn:active { background: #a855f7; }

  /* Controles inferiores (solo en fullscreen) */
  .preview-controls {
    display: none;
    padding: 8px 12px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    background: #140f22;
    border-top: 1px solid #2e2444;
    gap: 8px;
    flex-shrink: 0;
  }
  .preview-controls button {
    flex: 1;
    padding: 12px 8px;
    border-radius: 10px;
    font-size: 13px; font-weight: 700;
    cursor: pointer;
    border: 1px solid #4a3a68;
    background: #2e2444;
    color: #e8e0f5;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    white-space: nowrap;
    font-family: inherit;
  }
  .preview-controls button:active { background: #4a3a68; transform: scale(0.98); }
  .preview-controls button.primary {
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    border-color: #c084fc;
    color: #fff;
  }
  .preview-controls button.primary:active {
    background: linear-gradient(135deg, #9333ea, #6d28d9);
  }

  /* ===== ESTADO FULLSCREEN ===== */
  .preview-container.fullscreen {
    position: fixed;
    inset: 0;
    z-index: 200;
    border-radius: 0;
    border: none;
    width: 100vw;
    height: 100vh;
    box-shadow: none;
  }
  .preview-container.fullscreen .preview-topbar { display: flex; }
  .preview-container.fullscreen .preview-controls { display: flex; }
  .preview-container.fullscreen .preview-body { min-height: 0; }
  .preview-container.fullscreen .open-full-btn { display: none; }

  /* ===== TARJETA INFO DE LA VERSIÓN ===== */
  .version-info-card {
    display: flex; align-items: center; gap: 12px;
    padding: 12px;
    background: #140f22;
    border: 1px solid #2e2444;
    border-radius: 10px;
    margin-top: 8px;
  }
  .version-info-card .icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    border: 1px solid #c084fc;
  }
  .version-info-card .info-txt {
    flex: 1; min-width: 0;
  }
  .version-info-card .info-txt .name {
    font-size: 13px;
    font-weight: 700;
    font-family: ui-monospace, monospace;
    color: #c084fc;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .version-info-card .info-txt .stats {
    font-size: 11px;
    color: #9b8fb8;
    font-family: ui-monospace, monospace;
    margin-top: 3px;
  }
  .version-info-card .btn-code {
    background: #2e2444; color: #c084fc;
    border: 1px solid #4a3a68;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px; font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }
  .version-info-card .btn-code:active { background: #4a3a68; }

  /* ===== BARRA INFERIOR FIJA ===== */
  .bottom-dock {
    position: fixed; bottom: 0; left: 0; right: 0; width: 100%;
    background: #140f22; border-top: 1px solid #2e2444;
    z-index: 50; box-shadow: 0 -4px 15px rgba(0,0,0,0.65);
    display: flex; flex-direction: column;
    will-change: bottom;
  }

  .quick-bar-row {
    padding: 6px 8px;
    background: #1c1533;
    border-bottom: 1px solid #2e2444;
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .quick-bar-row input {
    height: 42px; margin: 0; padding: 6px 12px;
    font-size: 14px; border-color: #a855f7; background: #241a3d;
  }

  .bar-row {
    display: flex; gap: 6px; padding: 8px 10px; width: 100%;
    align-items: center; justify-content: space-between;
  }
  .bar-row + .bar-row { border-top: 1px solid rgba(255,255,255,0.05); }

  .dock-btn {
    flex: 1; padding: 12px 4px; font-size: 13px; font-weight: 600;
    border-radius: 8px; border: 1px solid #4a3a68; background: #2e2444; color: #e8e0f5;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
    white-space: nowrap;
  }
  .dock-btn:active { background: #4a3a68; transform: scale(0.98); }

  .dock-btn.mega-primary {
    flex: 1;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    border-color: #c084fc; color: #fff;
    font-size: 15px; font-weight: 700; padding: 14px 6px;
    box-shadow: 0 4px 10px rgba(168, 85, 247, 0.45);
  }
  .dock-btn.mega-primary:active {
    background: linear-gradient(135deg, #9333ea, #6d28d9);
  }

  .dock-btn.danger { background: #4a1738; border-color: #6b1f52; color: #ffb4dc; }
  .dock-btn.danger:active { background: #6b1f52; }

  .dock-btn.warn { background: #3d2a52; border-color: #5a3f7a; color: #d8b9ff; }
  .dock-btn.warn:active { background: #5a3f7a; }

  .fab {
    position: fixed;
    bottom: 210px;
    right: 16px;
    z-index: 60;
    width: 58px; height: 58px; border-radius: 50%;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    color: #fff; font-size: 26px;
    border: 2px solid #c084fc;
    box-shadow: 0 6px 18px rgba(168, 85, 247, 0.6);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease;
    padding: 0;
    will-change: bottom;
  }
  .fab:active { transform: scale(0.92); }
  .fab-label {
    position: absolute;
    bottom: -18px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: #c084fc; font-weight: 800;
    background: #140f22; padding: 1px 5px; border-radius: 4px;
    border: 1px solid #2e2444; white-space: nowrap;
  }

  /* ===== MODALES ===== */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(10,5,20,0.85);
    z-index: 300; padding: 16px;
    align-items: center; justify-content: center;
  }
  .modal-overlay.visible { display: flex; }
  .modal-content {
    background: #221a35; width: 100%; max-width: 520px; border-radius: 12px;
    padding: 16px; border: 1px solid #4a3a68;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-title {
    color: #c084fc; font-size: 15px; margin: 0 0 12px 0;
    text-transform: none; letter-spacing: 0;
    display: flex; align-items: center; gap: 8px;
  }
  .modal-label {
    display: block; font-size: 11px; color: #9b8fb8;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 10px 0 4px;
  }
  .modal-hint { font-size: 11px; color: #7a6f96; margin-top: 4px; line-height: 1.4; }
  .modal-content textarea { height: 180px; margin: 0; }
  .modal-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .modal-row button {
    flex: 1; min-width: 45%; padding: 13px; border-radius: 8px;
    font-weight: bold; border: 1px solid #4a3a68; background: #2e2444;
    color: #fff; cursor: pointer; font-size: 14px;
  }
  .btn-primario {
    background: linear-gradient(135deg, #a855f7, #7c3aed) !important;
    border-color: #c084fc !important;
  }

  .nombre-row { display: flex; gap: 8px; align-items: stretch; }
  .nombre-row input { flex: 1; }
  .btn-editar-nombre {
    flex-shrink: 0;
    background: #2e2444; color: #c084fc;
    border: 1px solid #a855f7; border-radius: 8px;
    padding: 0 14px; font-size: 13px; font-weight: 700;
    cursor: pointer;
  }
  .btn-editar-nombre:active { background: #4a3a68; }

  #nombreNuevoPedazo[readonly] {
    background: #18122a;
    color: #c084fc;
    border-color: #2e2444;
    cursor: default;
  }

  body.teclado-abierto .modal-overlay.visible {
    align-items: flex-start;
    padding-top: 12px;
  }
</style>
</head>
<body>

<!-- ===== BARRA SUPERIOR FIJA ===== -->
<header id="topBar">
  <span class="top-bar-icon">💜</span>
  <select id="fileSelect" onchange="cambiarPedazo()" class="top-bar-select">
    <option value="">— Sin prototipos —</option>
  </select>
  <span class="top-bar-status">
    <span class="status-dot" id="saveStatus"></span>
    <span id="saveText">Listo</span>
  </span>
</header>

<div class="info" id="infoBar">
  <span id="fileInfo">Sin carpeta abierta</span>
</div>

<!-- ===== VISTA PREVIA (con modo fullscreen) ===== -->
<h3>Vista previa del prototipo</h3>
<div class="preview-container" id="previewContainer">

  <!-- Barra superior (solo visible en fullscreen) -->
  <div class="preview-topbar">
    <button class="nav-btn" id="btnPrevVersion" onclick="navegarVersion(-1)" title="Versión anterior">◀</button>
    <div class="preview-title" id="previewTitle">—</div>
    <button class="nav-btn" id="btnNextVersion" onclick="navegarVersion(1)" title="Versión siguiente">▶</button>
    <button class="close-btn" onclick="cerrarPantallaPreview()" title="Cerrar">✕</button>
  </div>

  <!-- Iframe -->
  <div class="preview-body">
    <iframe id="preview" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
    <button class="open-full-btn" onclick="abrirPantallaPreview()">🔍 Ver en grande</button>
  </div>

  <!-- Controles inferiores (solo visible en fullscreen) -->
  <div class="preview-controls">
    <button class="primary" id="btnModoPreview" onclick="alternarModoPreview()">👁 Completo</button>
    <button onclick="refrescarPreview()">🔄 Refrescar</button>
    <button onclick="abrirCodigo()">📄 Código</button>
  </div>

</div>

<!-- Tarjeta info de la versión actual -->
<div class="version-info-card">
  <div class="icon">📄</div>
  <div class="info-txt">
    <div class="name" id="vName">—</div>
    <div class="stats" id="vStats">—</div>
  </div>
</div>

<!-- FAB: siempre crea una versión NUEVA -->
<button class="fab" id="fabPegar" onclick="pegarPedazo()" title="Pegar una versión NUEVA">
  📋
  <span class="fab-label">NUEVA V</span>
</button>

<!-- BARRA INFERIOR FIJA -->
<div class="bottom-dock" id="bottomDock">

  <div class="quick-bar-row">
    <input type="text" id="quickInput" placeholder="📋 Pega aquí una versión NUEVA de HTML…" autocomplete="off">
  </div>

  <div class="bar-row">
    <button class="dock-btn" onclick="abrirCarpeta()">📂 Carpetas</button>
    <button class="dock-btn" onclick="nuevoPedazoVacio()">➕ Nuevo</button>
    <button class="dock-btn" onclick="moverPedazo(-1)" title="Subir versión">⬆️</button>
    <button class="dock-btn" onclick="moverPedazo(1)" title="Bajar versión">⬇️</button>
    <button class="dock-btn danger" onclick="eliminarPedazo()" title="Eliminar archivo">🗑️</button>
  </div>

  <div class="bar-row">
    <button class="dock-btn" onclick="renombrarPedazo()">✏️ Renombrar</button>
    <button class="dock-btn warn" onclick="limpiarPedazoActual()">🧹 Limpiar</button>
  </div>

  <div class="bar-row">
    <button class="dock-btn mega-primary" onclick="pegarEnPedazoActual()">📥 Pegar en Actual</button>
  </div>

</div>

<!-- ===== MODAL NUEVA VERSIÓN ===== -->
<div id="modalNuevoPedazo" class="modal-overlay">
  <div class="modal-content">
    <h3 class="modal-title">💜 Nueva Versión</h3>

    <label class="modal-label" for="nombreNuevoPedazo">Nombre del archivo</label>
    <div class="nombre-row">
      <input type="text" id="nombreNuevoPedazo" class="modal-input" readonly autocomplete="off" spellcheck="false">
      <button type="button" class="btn-editar-nombre" id="btnEditarNombre" onclick="toggleEditarNombre()">✏️ Editar</button>
    </div>
    <div class="modal-hint">Se genera como <b>{carpeta}-vN</b>. Pulsa <b>✏️ Editar</b> si quieres cambiarlo.</div>

    <label class="modal-label" for="contenidoNuevoPedazo">Contenido</label>
    <textarea id="contenidoNuevoPedazo" readonly spellcheck="false"></textarea>

    <div class="modal-row">
      <button class="btn-primario" onclick="confirmarNuevoPedazo()">💾 Crear Versión</button>
      <button onclick="cerrarModalNuevoPedazo()" style="background:#3a2e52;">Cancelar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL VER CÓDIGO ===== -->
<div id="modalCodigo" class="modal-overlay">
  <div class="modal-content">
    <h3 class="modal-title">📄 Código de la versión</h3>
    <div class="modal-hint" id="codigoNombre" style="margin-bottom:8px;">—</div>
    <textarea id="codigoArea" readonly spellcheck="false" style="height:340px;"></textarea>
    <div class="modal-row">
      <button class="btn-primario" onclick="copiarCodigo()">📋 Copiar</button>
      <button onclick="cerrarModalCodigo()" style="background:#3a2e52;">Cerrar</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ESTADO GLOBAL
   ========================================================= */
let dirHandle    = null;
let pedazosDir   = null;
let pedazos      = [];
let indiceActual = -1;
let previewTimer   = null;
let modoPreview    = 'completo';
let enFullscreen   = false;

const NOMBRE_ORDEN    = '_orden.json';
const CARPETA_PEDAZOS = 'prototipos';
const LS_PREVIEW      = 'prototipos_modo_preview_violeta';

/* =========================================================
   APERTURA DE CARPETA
   ========================================================= */
async function abrirCarpeta() {
  if (!window.showDirectoryPicker) {
    alert('Tu navegador no soporta la API de Directorios.\nUsa Chrome, Edge o Kiwi Browser.');
    return;
  }
  try {
    dirHandle = await window.showDirectoryPicker();
    pedazosDir = await dirHandle.getDirectoryHandle(CARPETA_PEDAZOS, { create: true });
    await cargarTodo();
    setEstado('saved', 'Carpeta abierta');
  } catch (err) {
    if (err.name !== 'AbortError') console.error(err);
  }
}

/* =========================================================
   ORDEN
   ========================================================= */
async function leerOrden() {
  try {
    const fh = await dirHandle.getFileHandle(NOMBRE_ORDEN);
    const f  = await fh.getFile();
    const arr = JSON.parse(await f.text());
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}

async function guardarOrden() {
  if (!dirHandle) return;
  try {
    const fh = await dirHandle.getFileHandle(NOMBRE_ORDEN, { create: true });
    const w  = await fh.createWritable();
    await w.write(JSON.stringify(pedazos.map(p => p.nombre), null, 2));
    await w.close();
  } catch (e) { console.error('No se pudo guardar el orden:', e); }
}

/* =========================================================
   CARGA
   ========================================================= */
async function cargarTodo() {
  if (!pedazosDir) return;

  const orden = await leerOrden();
  const nombres = [];
  for await (const [name, handle] of pedazosDir.entries()) {
    if (handle.kind === 'file') nombres.push(name);
  }

  const enOrden = orden.filter(n => nombres.includes(n));
  const resto   = nombres.filter(n => !enOrden.includes(n)).sort();
  const lista   = [...enOrden, ...resto];

  pedazos = [];
  for (const nombre of lista) {
    try {
      const handle = await pedazosDir.getFileHandle(nombre);
      const file   = await handle.getFile();
      const contenido = await file.text();
      pedazos.push({ nombre, handle, contenido });
    } catch (e) { console.error('Error leyendo', nombre, e); }
  }

  indiceActual = pedazos.length > 0 ? 0 : -1;
  await guardarOrden();
  refrescarTodo();
}

/* =========================================================
   REFRESCO
   ========================================================= */
function refrescarTodo() {
  actualizarSelect();
  refrescarPreview();
  actualizarInfo();
  actualizarVersionCard();
  programarAjusteTeclado();
}

function actualizarSelect() {
  const sel = document.getElementById('fileSelect');
  sel.innerHTML = '';
  if (pedazos.length === 0) {
    const o = document.createElement('option');
    o.value = '';
    o.textContent = '— Sin prototipos —';
    sel.appendChild(o);
    return;
  }
  pedazos.forEach((p, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = `${String(i + 1).padStart(2, '0')}. ${p.nombre}`;
    sel.appendChild(o);
  });
  if (indiceActual >= 0 && indiceActual < pedazos.length) sel.value = indiceActual;
}

function actualizarInfo() {
  const totalLineas = pedazos.reduce(
    (a, p) => a + (p.contenido ? p.contenido.split('\n').length : 0), 0
  );
  const carpeta = dirHandle ? dirHandle.name : '—';
  const actual  = indiceActual >= 0 ? `${indiceActual + 1}/${pedazos.length}` : '0/0';
  document.getElementById('fileInfo').textContent =
    `📁 ${carpeta} · ${pedazos.length} versiones · ${totalLineas} líneas · viendo ${actual}`;
}

function actualizarVersionCard() {
  const name = document.getElementById('vName');
  const stats = document.getElementById('vStats');

  if (indiceActual < 0 || !pedazos[indiceActual]) {
    name.textContent = 'Sin versión seleccionada';
    stats.textContent = '—';
    return;
  }

  const p = pedazos[indiceActual];
  const lineas = p.contenido ? p.contenido.split('\n').length : 0;
  const chars = p.contenido ? p.contenido.length : 0;
  name.textContent = p.nombre;
  stats.textContent = `${lineas} líneas · ${chars.toLocaleString()} caracteres`;
}

/* =========================================================
   ★ GENERACIÓN DEL NOMBRE POR VERSIÓN ★
   ========================================================= */
function sanitizarNombre(n) {
  n = (n || '').trim().replace(/[\\/:*?"<>|]/g, '-');
  if (!n) return '';
  if (!/\.[a-z0-9]+$/i.test(n)) n += '.html';
  return n;
}

function baseNombrePrototipo() {
  const bruto = dirHandle ? dirHandle.name : 'prototipo';
  const base = bruto
    .trim()
    .replace(/\s+/g, '-')
    .replace(/[\\/:*?"<>|]/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-+|-+$/g, '')
    .toLowerCase();
  return base || 'prototipo';
}

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function siguienteNombrePedazo() {
  const base = baseNombrePrototipo();
  const re = new RegExp('^' + escapeRegex(base) + '-v(\\d+)(?:\\.html)?$', 'i');

  let max = 0;
  for (const p of pedazos) {
    const m = p.nombre.match(re);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  }
  return `${base}-v${max + 1}`;
}

async function crearPedazo(nombre, contenido) {
  if (!pedazosDir) { alert('Primero abre una carpeta.'); return false; }

  nombre = sanitizarNombre(nombre);
  if (!nombre) { alert('Nombre inválido.'); return false; }

  const existentes = new Set(pedazos.map(p => p.nombre));
  if (existentes.has(nombre)) {
    const base = nombre.replace(/\.[a-z0-9]+$/i, '');
    const ext  = (nombre.match(/\.[a-z0-9]+$/i) || ['.html'])[0];
    let n = 2, candidato = nombre;
    while (existentes.has(candidato)) {
      candidato = `${base}-${n}${ext}`;
      n++;
    }
    nombre = candidato;
  }

  try {
    const handle = await pedazosDir.getFileHandle(nombre, { create: true });
    const w = await handle.createWritable();
    await w.write(contenido);
    await w.close();

    pedazos.push({ nombre, handle, contenido });
    indiceActual = pedazos.length - 1;
    await guardarOrden();
    refrescarTodo();
    return true;
  } catch (e) {
    console.error(e);
    alert('No se pudo crear el archivo: ' + e.message);
    return false;
  }
}

/* =========================================================
   MODAL NUEVA VERSIÓN
   ========================================================= */
function abrirModalNuevoPedazo(contenido) {
  if (!dirHandle) {
    alert('Primero abre una carpeta con el botón 📂 Carpetas.');
    return;
  }

  const inpNombre = document.getElementById('nombreNuevoPedazo');
  inpNombre.value = siguienteNombrePedazo();
  inpNombre.readOnly = true;
  document.getElementById('btnEditarNombre').textContent = '✏️ Editar';

  const txtContenido = document.getElementById('contenidoNuevoPedazo');
  txtContenido.value = contenido || '';
  txtContenido.readOnly = true;

  document.getElementById('modalNuevoPedazo').classList.add('visible');

  setTimeout(() => {
    document.getElementById('btnEditarNombre').blur();
    document.activeElement && document.activeElement.blur();
  }, 20);
}

function toggleEditarNombre() {
  const inp = document.getElementById('nombreNuevoPedazo');
  const btn = document.getElementById('btnEditarNombre');

  if (inp.readOnly) {
    inp.readOnly = false;
    btn.textContent = '✅ Listo';
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
  } else {
    inp.readOnly = true;
    btn.textContent = '✏️ Editar';
    inp.blur();
  }
}

function cerrarModalNuevoPedazo() {
  const inp = document.getElementById('nombreNuevoPedazo');
  inp.readOnly = true;
  document.getElementById('btnEditarNombre').textContent = '✏️ Editar';
  inp.blur();
  document.getElementById('modalNuevoPedazo').classList.remove('visible');
}

async function confirmarNuevoPedazo() {
  const nombre   = document.getElementById('nombreNuevoPedazo').value;
  const contenido = document.getElementById('contenidoNuevoPedazo').value;

  if (!contenido.trim()) { alert('El contenido está vacío.'); return; }

  cerrarModalNuevoPedazo();
  const ok = await crearPedazo(nombre, contenido);
  if (ok) setEstado('saved', 'Versión creada');
}

/* =========================================================
   CAMBIAR VERSIÓN
   ========================================================= */
async function cambiarPedazo() {
  const val = document.getElementById('fileSelect').value;
  indiceActual = val === '' ? -1 : parseInt(val, 10);
  refrescarPreview();
  actualizarInfo();
  actualizarVersionCard();
}

/* ★ Navegar entre versiones desde la pantalla completa ★ */
function navegarVersion(dir) {
  if (pedazos.length === 0) return;
  const j = indiceActual + dir;
  if (j < 0 || j >= pedazos.length) return;

  indiceActual = j;
  document.getElementById('fileSelect').value = indiceActual;
  refrescarPreview();
  actualizarInfo();
  actualizarVersionCard();

  // Feedback visual en las flechas
  const btn = document.getElementById(dir < 0 ? 'btnPrevVersion' : 'btnNextVersion');
  if (btn) {
    btn.style.transform = 'scale(0.88)';
    setTimeout(() => { btn.style.transform = ''; }, 120);
  }
}

/* =========================================================
   ★ PANTALLA COMPLETA DE PREVIEW ★
   ========================================================= */
function abrirPantallaPreview() {
  enFullscreen = true;
  document.body.classList.add('preview-fullscreen');
  document.getElementById('previewContainer').classList.add('fullscreen');
  actualizarTituloPreview();
  // Pequeño delay para que el layout se asiente antes de redibujar
  setTimeout(() => refrescarPreview(), 100);
}

function cerrarPantallaPreview() {
  enFullscreen = false;
  document.body.classList.remove('preview-fullscreen');
  document.getElementById('previewContainer').classList.remove('fullscreen');
}

function actualizarTituloPreview() {
  const title = document.getElementById('previewTitle');
  const prevBtn = document.getElementById('btnPrevVersion');
  const nextBtn = document.getElementById('btnNextVersion');
  if (!title) return;

  if (indiceActual >= 0 && pedazos[indiceActual]) {
    const total = pedazos.length;
    title.textContent = `${pedazos[indiceActual].nombre}  ·  ${indiceActual + 1}/${total}`;
  } else {
    title.textContent = '—';
  }

  if (prevBtn) prevBtn.disabled = indiceActual <= 0;
  if (nextBtn) nextBtn.disabled = indiceActual < 0 || indiceActual >= pedazos.length - 1;
}

/* =========================================================
   OPERACIONES
   ========================================================= */
async function nuevoPedazoVacio() {
  if (!dirHandle) { alert('Primero abre una carpeta.'); return; }
  const ok = await crearPedazo(siguienteNombrePedazo(), '');
  if (ok) setEstado('saved', 'Versión vacía creada');
}

async function renombrarPedazo() {
  if (indiceActual < 0) { alert('No hay versión seleccionada.'); return; }

  const p = pedazos[indiceActual];
  let nombre = prompt('Nuevo nombre de la versión:', p.nombre);
  if (nombre === null) return;

  nombre = sanitizarNombre(nombre);
  if (!nombre || nombre === p.nombre) return;

  if (pedazos.some((x, i) => i !== indiceActual && x.nombre === nombre)) {
    alert('Ya existe una versión con ese nombre.');
    return;
  }

  try {
    const nuevoHandle = await pedazosDir.getFileHandle(nombre, { create: true });
    const w = await nuevoHandle.createWritable();
    await w.write(p.contenido);
    await w.close();

    try { await pedazosDir.removeEntry(p.nombre); } catch (e) { console.warn(e); }

    p.nombre = nombre;
    p.handle = nuevoHandle;
    await guardarOrden();
    refrescarTodo();
    actualizarTituloPreview();
    setEstado('saved', 'Renombrado');
  } catch (e) {
    console.error(e);
    alert('No se pudo renombrar: ' + e.message);
  }
}

async function eliminarPedazo() {
  if (indiceActual < 0) { alert('No hay versión seleccionada.'); return; }
  const p = pedazos[indiceActual];
  if (!confirm(`¿Eliminar la versión "${p.nombre}"?\n\nEsta acción borra el archivo del disco.`)) return;

  try { await pedazosDir.removeEntry(p.nombre); } catch (e) { console.warn(e); }

  pedazos.splice(indiceActual, 1);
  if (indiceActual >= pedazos.length) indiceActual = pedazos.length - 1;
  await guardarOrden();
  refrescarTodo();
  actualizarTituloPreview();
  setEstado('saved', 'Versión eliminada');
}

async function moverPedazo(dir) {
  if (indiceActual < 0) return;
  const j = indiceActual + dir;
  if (j < 0 || j >= pedazos.length) return;

  [pedazos[indiceActual], pedazos[j]] = [pedazos[j], pedazos[indiceActual]];
  indiceActual = j;
  await guardarOrden();
  refrescarTodo();
  actualizarTituloPreview();
}

async function limpiarPedazoActual() {
  if (indiceActual < 0 || indiceActual >= pedazos.length) {
    alert('Selecciona primero una versión en la barra superior.');
    return;
  }
  const p = pedazos[indiceActual];

  if (!confirm(`⚠️ ¿Limpiar TODO el contenido de "${p.nombre}"?\n\nEl archivo seguirá existiendo pero vacío.`)) return;

  p.contenido = '';

  try {
    const w = await p.handle.createWritable();
    await w.write('');
    await w.close();
    setEstado('saved', 'Versión limpiada');
  } catch (e) {
    console.error(e);
    setEstado('error', 'Error al limpiar');
  }

  refrescarPreview();
  actualizarInfo();
  actualizarVersionCard();
}

async function pegarEnPedazoActual() {
  if (indiceActual < 0 || indiceActual >= pedazos.length) {
    alert('Selecciona primero una versión en la barra superior.');
    return;
  }

  let texto;
  try {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      alert('Tu navegador no permite leer el portapapeles.');
      return;
    }
    texto = await navigator.clipboard.readText();
  } catch (e) {
    alert('No se pudo leer el portapapeles.');
    return;
  }

  if (!texto || !texto.trim()) {
    alert('El portapapeles está vacío.');
    return;
  }

  const p = pedazos[indiceActual];

  if (p.contenido && p.contenido.trim() !== '') {
    if (!confirm(`📥 ¿Pegar el portapapeles en "${p.nombre}"?\n\n⚠️ Esto reemplazará su contenido actual.`)) return;
  }

  p.contenido = texto;

  try {
    const w = await p.handle.createWritable();
    await w.write(texto);
    await w.close();
    setEstado('saved', 'Pegado en versión actual');
  } catch (e) {
    console.error(e);
    setEstado('error', 'Error al pegar');
  }

  refrescarPreview();
  actualizarInfo();
  actualizarVersionCard();
}

async function pegarPedazo() {
  if (!dirHandle) { alert('Primero abre una carpeta con el botón 📂 Carpetas.'); return; }
  try {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      alert('Tu navegador no permite leer el portapapeles.\nUsa el campo de arriba y pega ahí.');
      return;
    }
    const texto = await navigator.clipboard.readText();
    if (texto && texto.trim()) {
      abrirModalNuevoPedazo(texto);
    } else {
      alert('El portapapeles está vacío.');
    }
  } catch (err) {
    console.error(err);
    alert('No se pudo leer el portapapeles.\nUsa el campo de texto de la barra inferior.');
  }
}

/* =========================================================
   VISTA PREVIA
   ========================================================= */
function placeholderHTML() {
  return `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;
    background:#1a1528;color:#9b8fb8;
    display:flex;align-items:center;justify-content:center;
    height:100vh;text-align:center;padding:20px;line-height:1.6;}
    .box{max-width:320px;}
    .icon{font-size:48px;opacity:0.6;margin-bottom:10px;}
    .title{font-weight:700;font-size:15px;color:#c084fc;margin-bottom:6px;}
  </style></head><body>
    <div class="box">
      <div class="icon">💜</div>
      <div class="title">Sin vista previa</div>
      <div>Abre una carpeta con prototipos o pega uno nuevo para verlo aquí.</div>
    </div>
  </body></html>`;
}

function refrescarPreview() {
  const iframe = document.getElementById('preview');
  let html;

  if (modoPreview === 'completo') {
    html = pedazos.map(p => p.contenido).join('\n');
  } else {
    html = (indiceActual >= 0 && pedazos[indiceActual]) ? pedazos[indiceActual].contenido : '';
  }

  if (!html || !html.trim()) {
    iframe.srcdoc = placeholderHTML();
  } else {
    iframe.srcdoc = html;
  }

  actualizarTituloPreview();
}

function alternarModoPreview() {
  modoPreview = (modoPreview === 'completo') ? 'pedazo' : 'completo';
  actualizarBotonModoPreview();
  localStorage.setItem(LS_PREVIEW, modoPreview);
  refrescarPreview();
}

function actualizarBotonModoPreview() {
  const btn = document.getElementById('btnModoPreview');
  if (btn) {
    btn.textContent = modoPreview === 'completo' ? '👁 Completo' : '👁 Solo versión';
  }
}

/* =========================================================
   MODAL VER CÓDIGO
   ========================================================= */
function abrirCodigo() {
  if (indiceActual < 0 || !pedazos[indiceActual]) {
    alert('No hay versión seleccionada.');
    return;
  }
  const p = pedazos[indiceActual];
  document.getElementById('codigoNombre').textContent = p.nombre;
  document.getElementById('codigoArea').value = p.contenido || '';
  document.getElementById('modalCodigo').classList.add('visible');
}

function cerrarModalCodigo() {
  document.getElementById('modalCodigo').classList.remove('visible');
}

async function copiarCodigo() {
  const txt = document.getElementById('codigoArea').value;
  try {
    await navigator.clipboard.writeText(txt);
    setEstado('saved', 'Código copiado');
  } catch (e) {
    alert('No se pudo copiar. Selecciona el texto y cópialo manualmente.');
  }
}

/* =========================================================
   ESTADO VISUAL
   ========================================================= */
function setEstado(clase, texto) {
  const dot = document.getElementById('saveStatus');
  const txt = document.getElementById('saveText');
  dot.className = 'status-dot ' + clase;
  txt.textContent = texto;
}

/* =========================================================
   TECLADO EN PANTALLA
   ========================================================= */
const vv = window.visualViewport || null;
let alturaTeclado = 0;
let rafTeclado = null;

function calcularAlturaTeclado() {
  if (!vv) return 0;
  const hueco = window.innerHeight - (vv.height + vv.offsetTop);
  return hueco > 120 ? Math.round(hueco) : 0;
}

function aplicarAjusteTeclado() {
  const dock = document.getElementById('bottomDock');
  const fab  = document.getElementById('fabPegar');
  if (!dock) return;

  const altoDock = dock.offsetHeight || 230;

  dock.style.bottom = alturaTeclado + 'px';
  if (fab) fab.style.bottom = (altoDock + 14 + alturaTeclado) + 'px';
  document.body.style.paddingBottom = (altoDock + 40 + alturaTeclado) + 'px';
  document.body.classList.toggle('teclado-abierto', alturaTeclado > 0);
}

function programarAjusteTeclado() {
  if (rafTeclado) return;
  rafTeclado = requestAnimationFrame(() => {
    rafTeclado = null;
    alturaTeclado = calcularAlturaTeclado();
    aplicarAjusteTeclado();
  });
}

if (vv) {
  vv.addEventListener('resize', programarAjusteTeclado);
  vv.addEventListener('scroll', programarAjusteTeclado);
}
window.addEventListener('resize', programarAjusteTeclado);
window.addEventListener('orientationchange', () => {
  setTimeout(programarAjusteTeclado, 100);
  setTimeout(programarAjusteTeclado, 350);
});

function reajustarTecladoConRetraso() {
  [0, 80, 200, 400, 650].forEach(ms => setTimeout(programarAjusteTeclado, ms));
}
document.addEventListener('focusin',  reajustarTecladoConRetraso, true);
document.addEventListener('focusout', reajustarTecladoConRetraso, true);

/* =========================================================
   LISTENERS GLOBALES
   ========================================================= */
document.addEventListener('DOMContentLoaded', () => {

  const qi = document.getElementById('quickInput');

  qi.addEventListener('paste', (e) => {
    const texto = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
    if (texto && texto.trim()) {
      e.preventDefault();
      abrirModalNuevoPedazo(texto);
      setTimeout(() => { qi.value = ''; qi.blur(); }, 0);
    }
  });

  qi.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const texto = qi.value;
      if (texto && texto.trim()) {
        abrirModalNuevoPedazo(texto);
        qi.value = '';
        qi.blur();
      }
    }
  });

  document.getElementById('nombreNuevoPedazo').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const inp = e.target;
      inp.readOnly = true;
      document.getElementById('btnEditarNombre').textContent = '✏️ Editar';
      inp.blur();
    }
  });

  document.getElementById('modalNuevoPedazo').addEventListener('click', (e) => {
    if (e.target.id === 'modalNuevoPedazo') cerrarModalNuevoPedazo();
  });

  document.getElementById('modalCodigo').addEventListener('click', (e) => {
    if (e.target.id === 'modalCodigo') cerrarModalCodigo();
  });

  // Tecla Escape para cerrar fullscreen
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (enFullscreen) { cerrarPantallaPreview(); return; }
      const modalCod = document.getElementById('modalCodigo');
      if (modalCod.classList.contains('visible')) { cerrarModalCodigo(); return; }
      const modalNuevo = document.getElementById('modalNuevoPedazo');
      if (modalNuevo.classList.contains('visible')) { cerrarModalNuevoPedazo(); return; }
    }
  });

  programarAjusteTeclado();
  setTimeout(programarAjusteTeclado, 300);
});

/* =========================================================
   INTERCEPTOR GLOBAL DE PEGADO
   ========================================================= */
document.addEventListener('paste', (e) => {
  const t = e.target;
  const esEditable =
    (t.tagName === 'INPUT' && t.type === 'text' && !t.readOnly) ||
    (t.tagName === 'TEXTAREA' && !t.readOnly);

  if (esEditable) return;

  const texto = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
  if (texto && texto.trim()) {
    e.preventDefault();
    abrirModalNuevoPedazo(texto);
  }
});

/* =========================================================
   SERVICE WORKER (PWA)
   ========================================================= */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('Service Worker registrado.'))
      .catch((err) => console.log('Fallo al registrar Service Worker:', err));
  });
}

/* =========================================================
   INICIALIZACIÓN
   ========================================================= */
(function init() {
  const mp = localStorage.getItem(LS_PREVIEW);
  if (mp === 'pedazo' || mp === 'completo') modoPreview = mp;
  actualizarBotonModoPreview();

  refrescarTodo();
  programarAjusteTeclado();
})();
</script>
